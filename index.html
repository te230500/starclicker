<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCADE PORTAL</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a; /* slate-900ベース */
            /* 宇宙やサイバー空間を思わせる暗いグラデーション背景 */
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0.2) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,0.2) 0, transparent 50%);
            color: #e2e8f0;
        }

        /* ゲーミング風のカードホバーエフェクト */
        .game-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(145deg, #1e293b, #0f172a);
        }
        
        /* Star Clicker用のホバー色（黄色） */
        .game-card.star:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(234, 179, 8, 0.3);
            border-color: #facc15;
        }

        /* Minesweeper用のホバー色（シアン） */
        .game-card.mine:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(6, 182, 212, 0.3);
            border-color: #22d3ee;
        }
    </style>
</head>
<body class="min-h-screen py-8 px-4 sm:py-12 sm:px-6 md:px-8 font-sans">

    <div class="max-w-5xl mx-auto">
        <!-- サイトタイトル -->
        <header class="text-center mb-12 sm:mb-16">
            <h1 class="text-4xl sm:text-5xl md:text-6xl font-black mb-4 tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-500 to-yellow-400 drop-shadow-lg">
                ARCADE PORTAL
            </h1>
            <p class="text-slate-400 font-bold text-sm sm:text-base tracking-widest uppercase">
                Select Your Game
            </p>
        </header>

        <!-- ゲーム一覧 -->
        <main class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 sm:gap-8">

            <!-- 1つ目のゲーム：Star Clicker -->
            <a href="starclicker.html" target="_blank" class="game-card star rounded-2xl p-5 border border-slate-700 block group relative overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-br from-yellow-500/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                
                <!-- サムネイル画像（プレースホルダーもダークに合わせて色を変更） -->
                <div class="aspect-video bg-slate-800 rounded-xl mb-4 overflow-hidden relative border border-slate-700 group-hover:border-yellow-500/50 transition-colors">
                    <img src="https://placehold.co/600x338/1e293b/facc15?text=Star+Clicker" alt="Star Clicker" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity">
                </div>
                <!-- タイトルと説明 -->
                <h2 class="text-xl sm:text-2xl font-bold text-slate-200 mb-2 group-hover:text-yellow-400 transition-colors flex items-center gap-2">
                    <span>⭐</span> Star Clicker
                </h2>
                <p class="text-slate-400 text-sm mb-6 leading-relaxed line-clamp-3">
                    宇宙の彼方でお星さまをクリックしてスコアを稼ごう！施設をアップグレードして宇宙をインフレさせるクリッカーゲーム。
                </p>
                <!-- あそぶボタン -->
                <div class="bg-slate-800 text-yellow-500 border border-yellow-500/30 font-bold text-center py-3 rounded-xl group-hover:bg-yellow-500 group-hover:text-slate-900 transition-all tracking-widest uppercase text-sm">
                    Play Now
                </div>
            </a>

            <!-- 2つ目のゲーム：マインスイーパー -->
            <a href="minesweeper.html" target="_blank" class="game-card mine rounded-2xl p-5 border border-slate-700 block group relative overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-br from-cyan-500/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                
                <div class="aspect-video bg-slate-800 rounded-xl mb-4 overflow-hidden relative border border-slate-700 group-hover:border-cyan-500/50 transition-colors">
                    <img src="https://placehold.co/600x338/1e293b/22d3ee?text=Minesweeper" alt="マインスイーパー" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity">
                </div>
                <h2 class="text-xl sm:text-2xl font-bold text-slate-200 mb-2 group-hover:text-cyan-400 transition-colors flex items-center gap-2">
                    <span>💣</span> Minesweeper
                </h2>
                <p class="text-slate-400 text-sm mb-6 leading-relaxed line-clamp-3">
                    論理と直感で地雷を回避せよ。サイバーパンクな雰囲気の美しいマインスイーパーで神の領域を目指せ。
                </p>
                <div class="bg-slate-800 text-cyan-400 border border-cyan-400/30 font-bold text-center py-3 rounded-xl group-hover:bg-cyan-500 group-hover:text-slate-900 transition-all tracking-widest uppercase text-sm">
                    Play Now
                </div>
            </a>

        </main>

        <!-- フッター -->
        <footer class="mt-20 text-center text-slate-600 text-xs font-bold tracking-widest uppercase">
            <p>Created by You</p>
        </footer>
    </div>

</body>
</html>
